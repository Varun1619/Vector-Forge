x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    VF_WAREHOUSE_HOST: warehouse
    VF_WAREHOUSE_PORT: "5432"
    VF_WAREHOUSE_DB: vectorforge
    VF_WAREHOUSE_USER: vf
    VF_WAREHOUSE_PASSWORD: vf
    VF_MINIO_ENDPOINT: minio:9000
    VF_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    VF_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    VF_MINIO_BUCKET: vectorforge-raw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres: { condition: service_healthy }
    warehouse: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  warehouse:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vf
      POSTGRES_PASSWORD: vf
      POSTGRES_DB: vectorforge
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db:/var/lib/postgresql/data
      - ./scripts/init-warehouse.sql:/docker-entrypoint-initdb.d/init-warehouse.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vf"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/vectorforge-raw;
      echo bucket-ready;
      "

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname a --lastname a --role Admin --email a@vf.local || true
    depends_on:
      postgres: { condition: service_healthy }

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

volumes:
  postgres-db:
  warehouse-db:
  minio-data:
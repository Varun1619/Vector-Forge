name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest pandas pandera ruff
      - name: Lint
        run: ruff check dags include || true
      - name: Test
        env:
          PYTHONPATH: include
        run: pytest -q tests/